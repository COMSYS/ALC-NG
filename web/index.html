<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alc-ng — the arXiv submission cleaner</title>
    <!-- inline favicon, so it needs no asset and 404s nowhere -->

    <!-- The same app in two designs, side by side: tool/ and site/. -->
    <style>
      body { margin: 0; padding: 3rem 1.5rem; color: #1c2024; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 36rem; margin: 0 auto; }
      h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
      p { margin: 0 0 1.5rem; color: #5b6470; }
      ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.75rem; }
      a { display: block; padding: 0.9rem 1rem; border: 1px solid #d9dde2; border-radius: 6px; color: inherit; text-decoration: none; }
      a:hover { border-color: #1f5bd8; }
      a b { display: block; color: #1f5bd8; }
      a span { color: #5b6470; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>alc-ng</h1>
      <p>The arXiv submission cleaner, running in the browser. The same app in two designs:</p>
      <ul>
        <li>
          <a href="/tool/"><b>Tool</b><span>A plain working tool: the form on the left, the result on the right, the log underneath.</span></a>
        </li>
        <li>
          <a href="/site/"><b>Project page</b><span>In the design of arxiv.comsys.rwth-aachen.de, with its header and footer.</span></a>
        </li>
      </ul>
    </main>
  </body>
</html>
