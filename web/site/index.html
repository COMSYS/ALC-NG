<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alc-ng — clean your arXiv sources</title>
    <meta
      name="description"
      content="alc-ng sanitizes arXiv submissions entirely in your browser: dangling files, embedded metadata and hidden LaTeX content removed by the WebAssembly build, compiled with pdfTeX and XeTeX from SwiftLaTeX."
    />
    <meta name="theme-color" content="#006668" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- The ALC-NG mark (logo.svg, the broom sweeping the C), so the tab, the
         bookmark and a shared link all show the same thing the repository and
         the hero show. Served from public/assets/ with a version in the name:
         everything under /assets/ is cached immutably (see wasm-test/server). -->
    <link rel="icon" type="image/svg+xml" href="/assets/alcng-icon-v1.svg" />
    <link rel="apple-touch-icon" href="/assets/alcng-icon-v1.svg" />

    <!-- A pasted link is how this tool travels between authors, so it unfurls
         as a card. VITE_SITE_URL (web/.env) is the deployed address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hidden Secrets in the arXiv" />
    <meta property="og:title" content="alc-ng — clean your arXiv sources" />
    <meta
      property="og:description"
      content="Remove comments, unused files and other hidden content from your LaTeX sources before you upload them to arXiv. Runs entirely in your browser."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%assets/alcng-og-v1.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="alc-ng: clean your arXiv sources" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="alc-ng — clean your arXiv sources" />
    <meta
      name="twitter:description"
      content="Remove comments, unused files and other hidden content from your LaTeX sources before you upload them to arXiv. Runs entirely in your browser."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%assets/alcng-og-v1.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
